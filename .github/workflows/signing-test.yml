name: signing test
on: workflow_dispatch
jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Import certificate and sign two different binaries
        env:
          CERT: ${{ secrets.VOXFLOW_SIGNING_CERT }}
          PW: ${{ secrets.VOXFLOW_SIGNING_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain"; KP=$(uuidgen)
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/c.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/c.p12" -k "$KC" -P "$PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
          openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -clcerts -nokeys -passin "pass:$PW" -legacy 2>/dev/null | openssl x509 -out "$RUNNER_TEMP/c.pem" || openssl pkcs12 -in "$RUNNER_TEMP/c.p12" -clcerts -nokeys -passin "pass:$PW" | openssl x509 -out "$RUNNER_TEMP/c.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/c.pem" || security add-trusted-cert -r trustRoot -p codeSign -k "$KC" "$RUNNER_TEMP/c.pem"
          security find-identity -v -p codesigning "$KC"
          for n in one two; do
            mkdir -p $n.app/Contents/MacOS; echo "$n $RANDOM" > $n.app/Contents/MacOS/$n
            printf '#!/bin/sh\necho %s\n' "$n" > $n.app/Contents/MacOS/$n; chmod +x $n.app/Contents/MacOS/$n
            printf '<?xml version="1.0"?><plist version="1.0"><dict><key>CFBundleIdentifier</key><string>com.voxflow.app</string><key>CFBundleExecutable</key><string>%s</string></dict></plist>' "$n" > $n.app/Contents/Info.plist
            codesign --force --options runtime --keychain "$KC" -s "Voxflow Release Signing" $n.app
            codesign -d -r- $n.app 2>&1 | grep designated
            codesign -dvv $n.app 2>&1 | grep -E "Authority|Signature"
          done
